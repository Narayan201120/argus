# ARGUS routing configuration.
#
# Edit this file to change role-to-provider preferences or add named
# profiles without touching application code. Restart the API after edits.

# Ordered provider preference chains per role. First available provider
# in the chain wins; unknown IDs are skipped at selection time.
roles:
  researcher: [gemini, openai, claude, mistral]
  analyzer: [openai, mistral, claude, gemini]
  verifier: [claude, mistral, openai, gemini]
  synthesizer: [claude, openai, gemini, mistral]
  direct: [claude, openai, gemini, mistral]
  planner: [openai, claude, gemini, mistral]
  writer: [claude, openai, gemini, mistral]
  reviewer: [claude, openai, mistral, gemini]

# Named profiles restrict which providers are active for a request when
# the caller sets model_config.profile. Explicit model_config.connectors
# always wins over a profile.
#
# Two accepted forms per profile:
#   list form:            profile: [connector, ...]
#   rich form (below):    connectors + optional keywords used by the
#                         'semantic' router's keyword classifier. The
#                         keywords here override the built-in defaults.
profiles:
  research:
    connectors: [gemini, claude, mistral, openai]
    keywords: [research, literature, survey, sources, evidence, state of the art, papers, history of, compare]
  code:
    connectors: [openai, claude, mistral, gemini]
    keywords: [code, bug, stack trace, refactor, compile, regex, python, typescript, sql, docker, function, api endpoint]
  analysis:
    connectors: [claude, openai, mistral, gemini]
    keywords: [analyze, tradeoff, trade-offs, risk, strategy, evaluate, pros and cons, decision, benchmark, optimize, architecture]
  fast:
    connectors: [mistral, gemini]
    keywords: [quick, briefly, short answer, tl;dr, one-liner]

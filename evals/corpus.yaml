# P5-0 mock-only eval corpus (DEC-054).
#
# Verdicts never constrain terminal state: the expect.verdict field records the
# honest answer shape for a case, never a required pipeline outcome. A
# refused-correctly case passes with zero fabrication in any terminal state
# (empty board, no claims, no invented citations).
#
# Buckets:
#   radar-answerable: answerable from a CS-paper index (retrieval, RAG eval,
#     semantic routing topics).
#   rag-answerable:   answerable from the ARGUS repo itself (config, cache,
#     rate limiting, truncation, connector pins).
#   needs-web:        Sep-2026-current facts; mock-only runs answer from canned
#     evidence, live runs would need the web.
#   unanswerable:     must refuse; any claim would be fabrication.

- id: radar-01
  bucket: radar-answerable
  query: "How does dense passage retrieval score query-document pairs?"
  tools: [radar_search]
  expect: {min_evidence: 2, verdict: supported, must_cite: true}
  notes: "CS-paper index staple: bi-encoder dot-product scoring over passages."

